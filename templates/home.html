<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 15px;
            padding: 35px 45px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #777;
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }

        select,
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        select:focus,
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .button-container {
            margin-top: 30px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f4f6ff;
            border-radius: 8px;
            text-align: center;
            color: #333;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .container {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }

            .heading h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heading">
            <h1>Student Performance Prediction</h1>
            <p>Enter the student's details to predict the Mathematics score</p>
        </div>

        <form action="{{ url_for('predict_datapoint') }}" method="POST">

            <div class="form-grid">

                <!-- Gender -->
                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select id="gender" name="gender" required>
                        <option value="" selected disabled>
                            Select Gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>
                    </select>
                </div>


                <!-- Race/Ethnicity -->
                <div class="form-group">
                    <label for="race_ethnicity">
                        Race/Ethnicity
                    </label>

                    <select id="race_ethnicity"
                            name="race_ethnicity"
                            required>

                        <option value="" selected disabled>
                            Select Group
                        </option>

                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>

                    </select>
                </div>


                <!-- Parental Education -->
                <div class="form-group">
                    <label for="parental_level_of_education">
                        Parental Level of Education
                    </label>

                    <select id="parental_level_of_education"
                            name="parental_level_of_education"
                            required>

                        <option value="" selected disabled>
                            Select Education
                        </option>

                        <option value="some high school">
                            Some High School
                        </option>

                        <option value="high school">
                            High School
                        </option>

                        <option value="some college">
                            Some College
                        </option>

                        <option value="associate's degree">
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>

                        <option value="master's degree">
                            Master's Degree
                        </option>

                    </select>
                </div>


                <!-- Lunch -->
                <div class="form-group">
                    <label for="lunch">
                        Lunch
                    </label>

                    <select id="lunch"
                            name="lunch"
                            required>

                        <option value="" selected disabled>
                            Select Lunch Type
                        </option>

                        <option value="standard">
                            Standard
                        </option>

                        <option value="free/reduced">
                            Free/Reduced
                        </option>

                    </select>
                </div>


                <!-- Test Preparation -->
                <div class="form-group">
                    <label for="test_preparation_course">
                        Test Preparation Course
                    </label>

                    <select id="test_preparation_course"
                            name="test_preparation_course"
                            required>

                        <option value="" selected disabled>
                            Select Course Status
                        </option>

                        <option value="none">
                            None
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>
                </div>


                <!-- Reading Score -->
                <div class="form-group">
                    <label for="reading_score">
                        Reading Score
                    </label>

                    <input type="number"
                           id="reading_score"
                           name="reading_score"
                           min="0"
                           max="100"
                           placeholder="Enter reading score"
                           required>
                </div>


                <!-- Writing Score -->
                <div class="form-group">
                    <label for="writing_score">
                        Writing Score
                    </label>

                    <input type="number"
                           id="writing_score"
                           name="writing_score"
                           min="0"
                           max="100"
                           placeholder="Enter writing score"
                           required>
                </div>

            </div>


            <!-- Submit -->
            <div class="button-container">

                <button type="submit">
                    Predict Math Score
                </button>

            </div>

        </form>


        <!-- Prediction Result -->
        {% if results %}
        <div class="result">
            Predicted Mathematics Score:
            {{ results }}
        </div>
        {% endif %}

    </div>

</body>

</html>
